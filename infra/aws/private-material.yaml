AWSTemplateFormatVersion: '2010-09-09'
Description: VibeCheck private verification material bucket with GuardDuty Malware Protection for S3.

Parameters:
  BucketName:
    Type: String
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
  ObjectPrefix:
    Type: String
    Default: identity/verification/
    AllowedPattern: '^[A-Za-z0-9][A-Za-z0-9/_-]{0,127}/$'
  RuntimePrincipalArn:
    Type: String
    Description: IAM role ARN used by the VibeCheck API and worker. Do not pass a human principal.
    AllowedPattern: '^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]{1,128}$'
  AllowedUploadOrigins:
    Type: CommaDelimitedList
    Description: Exact HTTPS web origins allowed to perform browser PUT uploads.

Resources:
  PrivateMaterialBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: false
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT]
            AllowedOrigins: !Ref AllowedUploadOrigins
            AllowedHeaders:
              - content-type
              - if-none-match
              - x-amz-checksum-sha256
              - x-amz-content-sha256
              - x-amz-server-side-encryption
              - x-amz-tagging
            ExposedHeaders:
              - ETag
              - x-amz-checksum-sha256
            MaxAge: 300

  GuardDutyMalwareProtectionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: malware-protection-plan.guardduty.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: GuardDutyMalwareProtectionForPrivateMaterial
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AllowManagedRuleLifecycle
                Effect: Allow
                Action:
                  - events:PutRule
                  - events:DeleteRule
                  - events:PutTargets
                  - events:RemoveTargets
                Resource: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/DO-NOT-DELETE-AmazonGuardDutyMalwareProtectionS3*
                Condition:
                  StringLike:
                    events:ManagedBy: malware-protection-plan.guardduty.amazonaws.com
              - Sid: AllowManagedRuleInspection
                Effect: Allow
                Action:
                  - events:DescribeRule
                  - events:ListTargetsByRule
                Resource: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/DO-NOT-DELETE-AmazonGuardDutyMalwareProtectionS3*
              - Sid: AllowBucketNotificationConfiguration
                Effect: Allow
                Action:
                  - s3:PutBucketNotification
                  - s3:GetBucketNotification
                Resource: !GetAtt PrivateMaterialBucket.Arn
              - Sid: AllowBucketOwnershipCheck
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt PrivateMaterialBucket.Arn
              - Sid: AllowValidationObject
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${PrivateMaterialBucket.Arn}/malware-protection-resource-validation-object
              - Sid: AllowProtectedObjectScan
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:GetObjectTagging
                  - s3:GetObjectVersionTagging
                  - s3:PutObjectTagging
                  - s3:PutObjectVersionTagging
                Resource: !Sub ${PrivateMaterialBucket.Arn}/${ObjectPrefix}*

  PrivateMaterialMalwareProtectionPlan:
    Type: AWS::GuardDuty::MalwareProtectionPlan
    Properties:
      Role: !GetAtt GuardDutyMalwareProtectionRole.Arn
      ProtectedResource:
        S3Bucket:
          BucketName: !Ref PrivateMaterialBucket
          ObjectPrefixes:
            - !Ref ObjectPrefix
      Actions:
        Tagging:
          Status: ENABLED
      Tags:
        - Key: application
          Value: vibecheck
        - Key: data-classification
          Value: private-verification-material

  PrivateMaterialBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PrivateMaterialBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt PrivateMaterialBucket.Arn
              - !Sub ${PrivateMaterialBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: AllowRuntimeControlPlane
            Effect: Allow
            Principal:
              AWS: !Ref RuntimePrincipalArn
            Action:
              - s3:PutObject
              - s3:GetObject
              - s3:GetObjectTagging
              - s3:PutObjectTagging
            Resource: !Sub ${PrivateMaterialBucket.Arn}/${ObjectPrefix}*
          - Sid: DenyNonConditionalObjectCreation
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub ${PrivateMaterialBucket.Arn}/${ObjectPrefix}*
            Condition:
              Null:
                s3:if-none-match: 'true'
              Bool:
                s3:ObjectCreationOperation: 'true'
          - Sid: DenyReadUnlessGuardDutyClean
            Effect: Deny
            Principal: '*'
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
            Resource: !Sub ${PrivateMaterialBucket.Arn}/${ObjectPrefix}*
            Condition:
              StringNotEquals:
                s3:ExistingObjectTag/GuardDutyMalwareScanStatus: NO_THREATS_FOUND
              ArnNotLike:
                aws:PrincipalArn:
                  - !GetAtt GuardDutyMalwareProtectionRole.Arn
                  - !Ref RuntimePrincipalArn
          - Sid: DenyReadUnlessApplicationReady
            Effect: Deny
            Principal: '*'
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
            Resource: !Sub ${PrivateMaterialBucket.Arn}/${ObjectPrefix}*
            Condition:
              StringNotEquals:
                s3:ExistingObjectTag/VibeCheckAccess: ready
              ArnNotLike:
                aws:PrincipalArn:
                  - !GetAtt GuardDutyMalwareProtectionRole.Arn
                  - !Ref RuntimePrincipalArn

Outputs:
  BucketName:
    Value: !Ref PrivateMaterialBucket
  ObjectPrefix:
    Value: !Ref ObjectPrefix
  MalwareProtectionPlanId:
    Value: !GetAtt PrivateMaterialMalwareProtectionPlan.MalwareProtectionPlanId
  GuardDutyRoleArn:
    Value: !GetAtt GuardDutyMalwareProtectionRole.Arn
