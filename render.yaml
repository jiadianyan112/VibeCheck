# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
previews:
  generation: manual

services:
  - type: web
    name: vibecheck-web
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm run start -w @vibecheck/api
    healthCheckPath: /health/ready
    maxShutdownDelaySeconds: 30
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vibecheck-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: VITE_AUTH_ENABLED
        value: "true"
      - key: AUTH_ENABLED
        value: "true"
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_ENCRYPTION_KEY
        sync: false
      - key: EMAIL_ENCRYPTION_KEY_VERSION
        value: v1
      - key: EMAIL_HASH_PEPPER
        generateValue: true
      - key: OTP_PEPPER
        generateValue: true
      - key: AUTH_TOKEN_SECRET
        generateValue: true
      - key: CATALOG_ENABLED
        value: "true"
      - key: CATALOG_CURSOR_SECRET
        generateValue: true
      - key: SEARCH_ENABLED
        value: "true"
      - key: SEARCH_ENCRYPTION_MASTER_KEY
        sync: false
      - key: SEARCH_ENCRYPTION_KEY_VERSION
        value: v1
      - key: SEARCH_SUBJECT_HASH_PEPPER
        generateValue: true
      - key: SEARCH_RESULT_TOKEN_SECRET
        generateValue: true
      - key: SEARCH_SUBJECT_COOKIE_SECRET
        generateValue: true
      - key: COMPARISON_ENABLED
        value: "true"
      - key: COMPARISON_SUBJECT_HASH_PEPPER
        generateValue: true
      - key: COMPARISON_SUBJECT_COOKIE_SECRET
        generateValue: true
      - key: ANALYTICS_ENABLED
        value: "false"

  - type: worker
    name: vibecheck-worker
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm ci && npm run build:libraries && npm run build -w @vibecheck/worker
    startCommand: npm run start -w @vibecheck/worker
    maxShutdownDelaySeconds: 60
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vibecheck-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: WORKER_POLL_INTERVAL_MS
        value: "1000"
      - key: WORKER_BATCH_SIZE
        value: "25"

databases:
  - name: vibecheck-postgres
    region: singapore
    plan: basic-256mb
    postgresMajorVersion: "18"
    databaseName: vibecheck
    user: vibecheck
    ipAllowList: []
    storageAutoscalingEnabled: true
