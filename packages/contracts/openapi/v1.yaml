openapi: 3.1.0
info:
  title: VibeCheck API
  version: 0.1.0
  description: >-
    WP-04 platform, identity, discovery, interaction and submission-entry contract. Product operations are added only when
    their module enters implementation and must preserve the v1.10 PRD Operation IDs.
servers:
  - url: /
    description: Platform paths are root-relative; product paths use the /api/v1 prefix.
tags:
  - name: Platform
  - name: Identity
  - name: Catalog
  - name: Search
  - name: Comparison
  - name: Community
  - name: Analytics
  - name: Submission
  - name: Workflow
  - name: Media
  - name: Evidence
paths:
  /health/live:
    get:
      tags: [Platform]
      operationId: OP-PLATFORM-LIVE
      summary: Process liveness
      responses:
        '200':
          description: Process is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceHealth'
  /health/ready:
    get:
      tags: [Platform]
      operationId: OP-PLATFORM-READY
      summary: Dependency readiness
      responses:
        '200':
          description: Required dependencies are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceHealth'
        '503':
          description: At least one required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceHealth'
  /api/v1/auth/email-challenges:
    post:
      tags: [Identity]
      operationId: OP-AUTH-START
      summary: Start an email OTP login or administrator reauthentication flow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthChallengeRequest'
      responses:
        '202':
          description: Challenge accepted without revealing account existence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthChallengeAccepted'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/auth/email-challenges/{challenge_id}/verify:
    post:
      tags: [Identity]
      operationId: OP-AUTH-CALLBACK
      summary: Verify one email OTP and atomically establish or elevate a session
      parameters:
        - in: path
          name: challenge_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthVerifyRequest'
      responses:
        '200':
          description: OTP consumed exactly once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthVerificationResponse'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /api/v1/auth/session:
    get:
      tags: [Identity]
      operationId: OP-AUTH-SESSION-GET
      summary: Read the current server session and permission summary
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current active session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    delete:
      tags: [Identity]
      operationId: OP-AUTH-SESSION-DELETE
      summary: Revoke the current session
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [session_version]
              properties:
                session_version:
                  type: integer
                  minimum: 1
      responses:
        '204':
          description: Session revoked and cookies cleared.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/auth/pending-actions:
    post:
      tags: [Identity]
      operationId: OP-AUTH-PENDING-CREATE
      summary: Create one encrypted owner-bound action for post-login replay
      description: >-
        Anonymous callers are bound to the signed vc_anon cookie. Authenticated callers additionally
        require CSRF. A subject may have only one non-expired pending action; the same client request
        and payload is idempotent and a different payload is a 409 conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PendingActionCreateRequest'
      responses:
        '201':
          description: Encrypted action accepted; sensitive parameters are not returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingActionProjection'
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/auth/pending-actions/{pending_action_id}:
    get:
      tags: [Identity]
      operationId: OP-AUTH-PENDING-GET
      summary: Recover a non-sensitive pending-action projection
      parameters:
        - $ref: '#/components/parameters/PendingActionId'
        - in: query
          name: identity_link_id
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Owner-authorized projection without the encrypted action parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingActionProjection'
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/auth/pending-actions/{pending_action_id}/consume:
    post:
      tags: [Identity]
      operationId: OP-AUTH-PENDING-CONSUME
      summary: Execute and consume one post-login action through trusted server orchestration
      description: >-
        The browser supplies only the one-time identity link and expected state. The server decrypts
        the allowlisted payload, replays the real domain write with the originally stored request ID,
        internally signs the success receipt, then consumes the action and link. Domain failure leaves
        the action pending. If a guest comparison was not adopted because the account preserves a
        different category, that save action is cancelled without changing the account comparison.
        A consumed retry returns the same terminal projection without another write.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PendingActionId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PendingActionConsumeRequest'
      responses:
        '200':
          description: Consumed terminal state; the encrypted payload is cryptographically erased.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingActionProjection'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '501': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/auth/pending-actions/{pending_action_id}/cancel:
    post:
      tags: [Identity]
      operationId: OP-AUTH-PENDING-CANCEL
      summary: Irreversibly cancel an owner-authorized pending action
      parameters:
        - $ref: '#/components/parameters/PendingActionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PendingActionCancelRequest'
      responses:
        '200':
          description: Idempotent cancelled terminal state; all bound active replay links are revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingActionProjection'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/search:
    post:
      tags: [Search]
      operationId: OP-SEARCH
      summary: Execute or resume an owner-bound public keyword search
      description: >-
        Exactly one of query and query_id is accepted. The current implementation serves
        mode=search with PostgreSQL FTS and structured filters. mode=discover remains a
        frozen contract but returns SEARCH_DISCOVER_NOT_IMPLEMENTED until its work package ships.
        Raw query text is encrypted in QuerySnapshot and is never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Stable versioned search groups; no raw query is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchProjection'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '501':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/analytics/events:batch:
    post:
      tags: [Analytics]
      operationId: OP-ANALYTICS-INGEST
      summary: Ingest session-bound client analytics with per-item receipts
      description: >-
        The X-Analytics-Session header and per-item session_id are mutually exclusive. The collector
        accepts only comparison_dimension_viewed/v1 in this implementation increment; comparison_completed
        remains a server-derived fact and cannot be authored by the browser. Protected identity fields and
        sensitive text are rejected and never persisted.
      parameters:
        - in: header
          name: X-Analytics-Session
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 512
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsBatchEnvelope'
      responses:
        '202':
          description: Structurally valid batch with an accepted, deduplicated or rejected receipt per item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsBatchReceipt'
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/comparisons/{comparison_id}:
    parameters:
      - $ref: '#/components/parameters/ComparisonId'
    get:
      tags: [Comparison]
      operationId: OP-COMP-GET
      summary: Read the current owner-bound comparison version
      description: >-
        Anonymous ownership is bound to the signed vc_anon cookie and expires after seven days.
        Removed, merged or non-public projects remain as invalid tombstones instead of being silently removed.
      responses:
        '200':
          description: Current comparison version and its version-scoped progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonProjection'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    put:
      tags: [Comparison]
      operationId: OP-COMP-PUT
      summary: Atomically create or replace ordered comparison membership
      description: >-
        The first write uses comparison_version=0 and one to five projects and creates stored version 1.
        Later writes require the current version. A changed order or membership increments the version and
        resets progress for the new version; an identical list returns no_change without incrementing it.
        All projects must be public and belong to one category. Six or more is a 409 conflict and is never truncated.
        Authenticated browser writes additionally require a matching X-CSRF-Token header.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComparisonPutRequest'
      responses:
        '200':
          description: Created, changed or idempotently unchanged comparison.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonMutationProjection'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/comparisons/{comparison_id}/saved:
    put:
      tags: [Comparison]
      operationId: OP-COMP-SAVE
      summary: Set the final saved state for an authenticated comparison owner
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ComparisonId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComparisonSaveRequest'
      responses:
        '200':
          description: Comparison with the requested final saved state; repeated state is idempotent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonProjection'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/notifications:
    get:
      tags: [Community]
      operationId: OP-NOTIFICATION-LIST
      summary: List the authenticated recipient's notifications with unread items first
      security:
        - sessionCookie: []
      parameters:
        - in: query
          name: type
          required: false
          schema: { $ref: '#/components/schemas/NotificationType' }
        - in: query
          name: unread_only
          required: false
          schema: { type: boolean, default: false }
        - in: query
          name: cursor
          required: false
          schema: { type: string, minLength: 1, maxLength: 1024 }
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        '200':
          description: Recipient-isolated stable page and the recipient's current global unread count.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/notifications/read-state:
    put:
      tags: [Community]
      operationId: OP-NOTIFICATION-READ-SET
      summary: Irreversibly mark selected or all recipient notifications as read
      description: >-
        Read state is final. Replaying the same operation_id and body returns the original
        receipt; reusing the operation_id for different notification IDs returns a conflict.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationReadSetRequest' }
      responses:
        '200':
          description: Idempotent final read-state receipt and current unread count.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationReadProjection' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/interactions/{interaction_type}/{target_type}/{project_id}:
    put:
      tags: [Community]
      operationId: OP-INTERACT-SET
      summary: Set one authenticated user's final interaction state for a public project
      description: >-
        The operation is idempotent by user_id plus client_request_id. Setting follow=true
        atomically ensures favorite=true; setting favorite=false atomically ensures follow=false.
        The response always contains all three final states, counters, deltas and change sources.
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: interaction_type
          required: true
          schema: { type: string, enum: [favorite, like, follow] }
        - in: path
          name: target_type
          required: true
          schema: { type: string, const: project }
        - in: path
          name: project_id
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractionSetRequest'
      responses:
        '200':
          description: Changed or idempotently unchanged final state and atomically derived counters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectInteractionProjection'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/projects/{project_id}/comments:
    get:
      tags: [Community]
      operationId: OP-COMMENT-LIST
      summary: List only public visible or collapsed comments for one public project
      parameters:
        - in: path
          name: project_id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: cursor
          required: false
          schema: { type: string, minLength: 1, maxLength: 1024 }
        - in: query
          name: sort
          required: false
          schema: { type: string, const: latest, default: latest }
      responses:
        '200':
          description: Stable public page; non-public moderation states are not returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentPage' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    post:
      tags: [Community]
      operationId: OP-COMMENT-CREATE
      summary: Create one owner-bound comment in pending moderation state
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: project_id
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentCreateRequest' }
      responses:
        '201':
          description: New pending comment; public list and count remain unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentProjection' }
        '200':
          description: Idempotently recovered existing comment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentProjection' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/comments/{comment_id}/reports:
    post:
      tags: [Community]
      operationId: OP-COMMENT-REPORT
      summary: Report one currently public comment without exposing report content publicly
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: comment_id
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentReportRequest' }
      responses:
        '201':
          description: Report created, comment moved under review, and one review work item ensured.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentReportProjection' }
        '200':
          description: Existing active report returned idempotently.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentReportProjection' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/comments/{comment_id}/withdraw:
    post:
      tags: [Community]
      operationId: OP-COMMENT-WITHDRAW
      summary: Irreversibly withdraw the authenticated author's comment
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: comment_id
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentWithdrawRequest' }
      responses:
        '200':
          description: Author-withdrawn final state, including idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentProjection' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/auth/comparison-merge-conflicts/{conflict_id}:
