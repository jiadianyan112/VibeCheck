openapi: 3.1.0
info:
  title: VibeCheck API
  version: 0.1.0
  description: >-
    WP-02 platform and identity contract. Product operations are added only when
    their module enters implementation and must preserve the v1.10 PRD Operation IDs.
servers:
  - url: /
    description: Platform paths are root-relative; product paths use the /api/v1 prefix.
tags:
  - name: Platform
  - name: Identity
  - name: Catalog
paths:
  /health/live:
    get:
      tags: [Platform]
      operationId: OP-PLATFORM-LIVE
      summary: Process liveness
      responses:
        '200':
          description: Process is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceHealth'
  /health/ready:
    get:
      tags: [Platform]
      operationId: OP-PLATFORM-READY
      summary: Dependency readiness
      responses:
        '200':
          description: Required dependencies are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceHealth'
        '503':
          description: At least one required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceHealth'
  /api/v1/auth/email-challenges:
    post:
      tags: [Identity]
      operationId: OP-AUTH-START
      summary: Start an email OTP login or administrator reauthentication flow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthChallengeRequest'
      responses:
        '202':
          description: Challenge accepted without revealing account existence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthChallengeAccepted'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/auth/email-challenges/{challenge_id}/verify:
    post:
      tags: [Identity]
      operationId: OP-AUTH-CALLBACK
      summary: Verify one email OTP and atomically establish or elevate a session
      parameters:
        - in: path
          name: challenge_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthVerifyRequest'
      responses:
        '200':
          description: OTP consumed exactly once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthVerificationResponse'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /api/v1/auth/session:
    get:
      tags: [Identity]
      operationId: OP-AUTH-SESSION-GET
      summary: Read the current server session and permission summary
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current active session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    delete:
      tags: [Identity]
      operationId: OP-AUTH-SESSION-DELETE
      summary: Revoke the current session
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [session_version]
              properties:
                session_version:
                  type: integer
                  minimum: 1
      responses:
        '204':
          description: Session revoked and cookies cleared.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/projects:
    get:
      tags: [Catalog]
      operationId: OP-PROJ-LIST
      summary: List a stable page of public projects across one or both P0 categories
      parameters:
        - in: query
          name: category_id
          required: false
          schema:
            $ref: '#/components/schemas/CategoryId'
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 24
        - in: query
          name: cursor
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 1024
      responses:
        '200':
          description: Public project cards at one immutable listing snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListProjection'
        '400':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/v1/projects/{project_id}:
    get:
      tags: [Catalog]
      operationId: OP-PROJ-GET
      summary: Read one canonical public project at its current immutable version
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Public project projection; private author-relation states are excluded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectProjection'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/v1/creators/{creator_id}:
    get:
      tags: [Catalog]
      operationId: OP-CREATOR-GET
      summary: Read the canonical public creator profile and published project ids
      parameters:
        - in: path
          name: creator_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Public canonical creator projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorProjection'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: vc_session
  parameters:
    CsrfToken:
      in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 128
  responses:
    Error:
      description: Stable error envelope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CategoryId:
      type: string
      enum: [ai_learning_quiz, personal_site_portfolio]
    CategorySchemaVersion:
      type: string
      enum: [learning.v1, portfolio.v1]
    KnowledgeStateStringArray:
      type: object
      additionalProperties: false
      required: [knowledge_state, values, source_type, observed_at]
      properties:
        knowledge_state:
          type: string
          enum: [known_values, known_empty, unknown]
        values:
          type: array
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 50
        source_type:
          type: string
          enum: [platform_verified_fact, verified_author_statement, trusted_external_source, system_inference]
        observed_at:
          type: string
          format: date-time
    ProjectCoreSnapshot:
      type: object
      additionalProperties: false
      required:
        - current_name
        - public_url
        - repository_url
        - original_platform
        - cover_media_reference_ids
        - one_line_definition
        - ai_coding_tools
        - tech_stack
        - deployment_platform
        - maintenance_signal
        - status_note
      properties:
        current_name:
          type: string
          minLength: 1
          maxLength: 80
        public_url:
          type: string
          format: uri
          maxLength: 2048
        repository_url:
          type: [string, 'null']
          maxLength: 2048
        original_platform:
          type: [string, 'null']
          maxLength: 120
        cover_media_reference_ids:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 64
        one_line_definition:
          type: string
          minLength: 1
          maxLength: 80
        ai_coding_tools:
          $ref: '#/components/schemas/KnowledgeStateStringArray'
        tech_stack:
          type: array
          maxItems: 30
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 50
        deployment_platform:
          type: [string, 'null']
          maxLength: 120
        maintenance_signal:
          type: string
          enum: [repository_updated, page_updated, author_updated, no_public_change, unknown]
        status_note:
          type: [string, 'null']
          maxLength: 500
    LearningSchemaV1:
      type: object
      additionalProperties: false
      required:
        - target_users
        - core_problem
        - use_scenarios
        - main_inputs
        - main_outputs
        - core_flow
        - content_processing
        - practice_formats
        - feedback_methods
        - learning_records
        - differentiation
        - core_features
        - secondary_features
        - login_requirement
        - sharing_capability
      properties:
        target_users:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }
        core_problem: { type: string, minLength: 1, maxLength: 500 }
        use_scenarios:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }
        main_inputs:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }
        main_outputs:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }
        core_flow:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [order, name]
            properties:
              order: { type: integer, minimum: 1, maximum: 10 }
              name: { type: string, minLength: 1, maxLength: 80 }
        content_processing:
          type: array
          maxItems: 10
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }
        practice_formats:
          type: array
          maxItems: 9
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }
        feedback_methods:
          type: array
          maxItems: 7
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }
        learning_records:
          type: array
          maxItems: 10
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }
        differentiation: { type: [string, 'null'], maxLength: 1000 }
        core_features:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 80 }
        secondary_features:
          type: array
          maxItems: 30
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 80 }
        login_requirement:
          type: string
          enum: [none, partial, required, unknown]
        sharing_capability:
          type: string
          enum: [none, link, result, question_bank, collaboration, unknown]
    PortfolioSchemaV1:
      type: object
      additionalProperties: false
      required:
        - site_type
        - creator_roles
        - primary_goals
        - page_model
        - navigation_pattern
        - homepage_sequence
        - core_modules
        - project_showcase_format
        - case_study_depth
        - visual_styles
        - layout_patterns
        - color_character
        - theme_mode
        - interaction_level
        - interaction_patterns
        - responsive_support
        - blog_support
      properties:
        site_type:
          type: string
          enum: [personal_homepage, portfolio, online_resume, academic_homepage, hybrid]
        creator_roles:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }
        primary_goals:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }
        page_model:
          type: string
          enum: [single_page, multi_page, hybrid]
        navigation_pattern:
          type: [string, 'null']
          enum: [top_nav, side_nav, section_anchor, minimal_overlay, no_persistent_nav, other, null]
        homepage_sequence:
          type: array
          maxItems: 30
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }
        core_modules:
          type: array
          minItems: 2
          maxItems: 20
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }
        project_showcase_format:
          type: string
          enum: [card_grid, gallery, timeline, case_study_list, repository_list, full_bleed, mixed, none]
        case_study_depth:
          type: string
          enum: [none, summary, overview, deep]
        visual_styles:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }
        layout_patterns:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }
        color_character:
          type: string
          enum: [monochrome, neutral, brand_led, vivid, gradient_dominant, mixed]
        theme_mode:
          type: string
          enum: [light_only, dark_only, switchable, system_adaptive]
        interaction_level:
          type: string
          enum: [static, light, moderate, high]
        interaction_patterns:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }
        responsive_support:
          type: string
          enum: [confirmed, partial, not_supported, unknown]
        blog_support:
          type: string
          enum: [none, static, content_managed, unknown]
    CreatorSummary:
      type: object
      additionalProperties: false
      required: [creator_id, display_name, avatar_url, verification_status]
      properties:
        creator_id: { type: string, format: uuid }
        display_name: { type: string, minLength: 1, maxLength: 80 }
        avatar_url: { type: [string, 'null'], maxLength: 2048 }
        verification_status:
          type: string
          enum: [unverified, verified, disputed]
    InteractionSummary:
      type: object
      additionalProperties: false
      required: [favorite_count, like_count, follower_count, visible_comment_count]
      properties:
        favorite_count: { type: integer, minimum: 0 }
        like_count: { type: integer, minimum: 0 }
        follower_count: { type: integer, minimum: 0 }
        visible_comment_count: { type: integer, minimum: 0 }
    LatestEventSummary:
      type: [object, 'null']
      additionalProperties: false
      required: [event_id, event_type, event_time, time_precision, event_summary]
      properties:
        event_id: { type: string, format: uuid }
        event_type: { type: string, minLength: 1, maxLength: 64 }
        event_time: { type: string, format: date-time }
        time_precision:
          type: string
          enum: [exact, day, month, year, estimated]
        event_summary: { type: string, minLength: 1, maxLength: 500 }
    ProjectCardProjection:
      type: object
      additionalProperties: false
      required:
        - project_id
        - version_id
        - current_name
        - category_id
        - category_schema_version
        - one_line_definition
        - cover_media_reference_ids
        - access_status
        - review_status
        - last_verified_at
        - creator_summaries
        - ai_coding_tools
        - interaction_summary
        - latest_event_summary
        - read_version
      properties:
        project_id: { type: string, format: uuid }
        version_id: { type: string, format: uuid }
        current_name: { type: string, minLength: 1, maxLength: 80 }
        category_id: { $ref: '#/components/schemas/CategoryId' }
        category_schema_version: { $ref: '#/components/schemas/CategorySchemaVersion' }
        one_line_definition: { type: string, minLength: 1, maxLength: 80 }
        cover_media_reference_ids:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }
        access_status:
          type: string
          enum: [normal, login_required, partial_abnormal, link_unavailable, suspected_migration, paused, ended, unknown]
        review_status:
          type: string
          enum: [published_platform, published_author]
        last_verified_at: { type: string, format: date-time }
        creator_summaries:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/CreatorSummary' }
        ai_coding_tools: { $ref: '#/components/schemas/KnowledgeStateStringArray' }
        interaction_summary: { $ref: '#/components/schemas/InteractionSummary' }
        latest_event_summary: { $ref: '#/components/schemas/LatestEventSummary' }
        read_version: { type: integer, minimum: 1 }
    ProjectListProjection:
      type: object
      additionalProperties: false
      required: [items, next_cursor, result_version]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ProjectCardProjection' }
        next_cursor: { type: [string, 'null'], maxLength: 1024 }
        result_version: { type: string, pattern: '^[a-f0-9]{64}$' }
    ProjectProjection:
      type: object
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/ProjectCardProjection'
        - type: object
          required:
            - viewer_schema
            - visibility
            - project_core
            - category_data
            - first_seen_at
            - created_at
            - author_link_status
            - completeness_level
            - freshness_status
            - record_source
          properties:
            viewer_schema: { const: public }
            visibility: { const: public }
            project_core: { $ref: '#/components/schemas/ProjectCoreSnapshot' }
            category_data:
              oneOf:
                - $ref: '#/components/schemas/LearningSchemaV1'
                - $ref: '#/components/schemas/PortfolioSchemaV1'
            first_seen_at: { type: string, format: date-time }
            created_at: { type: string, format: date-time }
            author_link_status:
              type: string
              enum: [unlinked, pending, linked, failed, disputed]
            completeness_level:
              type: string
              enum: [complete, partial, limited, pending_verification, disputed]
            freshness_status:
              type: string
              enum: [valid, expiring, expired]
            record_source:
              type: string
              enum: [platform_editor, public_discovery, author_submission, user_submission]
    CreatorProjection:
      type: object
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/CreatorSummary'
        - type: object
          required: [viewer_schema, bio, contacts, published_project_ids, read_version]
          properties:
            viewer_schema: { const: public }
            bio: { type: string, maxLength: 1000 }
            contacts:
              type: array
              maxItems: 20
              items:
                type: object
                additionalProperties: { type: string }
            published_project_ids:
              type: array
              maxItems: 1000
              uniqueItems: true
              items: { type: string, format: uuid }
            read_version: { type: integer, minimum: 1 }
    ServiceHealth:
      type: object
      additionalProperties: false
      required: [status, service, version, commit, checked_at]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        service:
          type: string
          minLength: 1
          maxLength: 64
        version:
          type: string
          minLength: 1
          maxLength: 32
        commit:
          type: string
          minLength: 1
          maxLength: 64
        checked_at:
          type: string
          format: date-time
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ok, failed]
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message_key, request_id, retryable, retry_after_ms]
          properties:
            code:
              type: string
              minLength: 1
              maxLength: 64
            message_key:
              type: string
              minLength: 1
              maxLength: 128
            request_id:
              type: string
              minLength: 1
              maxLength: 64
            retryable:
              type: boolean
            retry_after_ms:
              type: [integer, 'null']
              minimum: 0
    AuthChallengeRequest:
      type: object
      additionalProperties: false
      required: [email, purpose, return_to, client_request_id]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
        purpose:
          type: string
          enum: [login, admin_confirm]
        return_to:
          type: string
          minLength: 1
          maxLength: 2048
        client_request_id:
          type: string
          format: uuid
        preview_token:
          type: string
          minLength: 32
          maxLength: 512
    AuthChallengeAccepted:
      type: object
      additionalProperties: false
      required: [auth_flow_id, challenge_id, expires_at, resend_after, masked_email]
      properties:
        auth_flow_id:
          type: string
          format: uuid
        challenge_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
        resend_after:
          type: string
          format: date-time
        masked_email:
          type: string
          minLength: 3
          maxLength: 320
    AuthVerifyRequest:
      type: object
      additionalProperties: false
      required: [auth_flow_id, otp, client_request_id]
      properties:
        auth_flow_id:
          type: string
          format: uuid
        otp:
          type: string
          pattern: '^[0-9]{6}$'
        client_request_id:
          type: string
          format: uuid
    AuthVerificationResponse:
      oneOf:
        - type: object
          additionalProperties: false
          required: [purpose, session, return_to]
          properties:
            purpose:
              const: login
            session:
              $ref: '#/components/schemas/AuthSession'
            return_to:
              type: string
              minLength: 1
              maxLength: 2048
        - type: object
          additionalProperties: false
          required: [purpose, reauth_grant_id, recent_auth_at, return_to]
          properties:
            purpose:
              const: admin_confirm
            reauth_grant_id:
              type: string
              format: uuid
            recent_auth_at:
              type: string
              format: date-time
            return_to:
              type: string
              minLength: 1
              maxLength: 2048
    AuthSession:
      type: object
      additionalProperties: false
      required:
        - authenticated
        - user_id
        - display_name
        - account_status
        - roles
        - primary_role
        - permissions
        - session_version
        - csrf_token
        - recent_auth_at
        - expires_at
      properties:
        authenticated:
          const: true
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
          minLength: 1
          maxLength: 320
        account_status:
          type: string
          enum: [active, restricted]
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [user, verified_author, editor, admin]
        primary_role:
          type: string
          enum: [user, verified_author, editor, admin]
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 64
        session_version:
          type: integer
          minimum: 1
        csrf_token:
          type: string
          minLength: 32
          maxLength: 128
        recent_auth_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
