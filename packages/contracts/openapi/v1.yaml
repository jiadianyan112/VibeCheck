          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/creators/{creator_id}:
    get:
      tags: [Catalog]
      operationId: OP-CREATOR-GET
      summary: Read the canonical public creator profile and published project ids
      parameters:
        - in: path
          name: creator_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Public canonical creator projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorProjection'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: vc_session
  parameters:
    WorkItemId:
      in: path
      name: work_item_id
      required: true
      schema:
        type: string
        format: uuid
    QueryId:
      in: path
      name: query_id
      required: true
      schema:
        type: string
        format: uuid
    ComparisonId:
      in: path
      name: comparison_id
      required: true
      schema:
        type: string
        format: uuid
    ConflictId:
      in: path
      name: conflict_id
      required: true
      schema:
        type: string
        format: uuid
    PendingActionId:
      in: path
      name: pending_action_id
      required: true
      schema:
        type: string
        format: uuid
    CsrfToken:
      in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 128
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9._:-]{8,128}$'
  responses:
    Error:
      description: Stable error envelope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    MediaTargetType:
      enum:
        - submission_draft
        - admin_project_creation_draft
        - admin_project_edit_draft
        - project_update
        - creator_profile_draft
        - project_version
        - creator_profile_version
    MediaResource:
      type: object
      additionalProperties: false
      required:
        - media_resource_id
        - declared_mime
        - detected_mime
        - byte_size
        - width
        - height
        - duration_ms
        - checksum_sha256
        - source
        - status
        - scan_result
        - rejection_reason_code
        - scan_attempt_count
        - next_scan_at
        - exif_removed
        - deletion_guard_active
        - version
        - created_at
        - updated_at
      properties:
        media_resource_id: { type: string, format: uuid }
        declared_mime: { type: string, maxLength: 128 }
        detected_mime: { type: [string, 'null'], maxLength: 128 }
        byte_size: { type: integer, minimum: 1 }
        width: { type: [integer, 'null'], minimum: 1 }
        height: { type: [integer, 'null'], minimum: 1 }
        duration_ms: { type: [integer, 'null'], minimum: 0 }
        checksum_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        source: { enum: [upload, migration] }
        status: { enum: [created, uploading, uploaded, scanning, processing, ready, rejected, deleted] }
        scan_result: { enum: [not_scanned, clean, malicious, unscannable] }
        rejection_reason_code: { type: [string, 'null'], maxLength: 64 }
        scan_attempt_count: { type: integer, minimum: 0 }
        next_scan_at: { type: [string, 'null'], format: date-time }
        exif_removed: { type: boolean }
        deletion_guard_active: { type: boolean }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MediaReference:
      type: object
      additionalProperties: false
      required:
        - media_reference_id
        - media_resource_id
        - target_type
        - target_id
        - role
        - alt_text
        - sort_order
        - crop_focus
        - variant
        - source_media_reference_id
        - version
        - created_at
        - updated_at
      properties:
        media_reference_id: { type: string, format: uuid }
        media_resource_id: { type: string, format: uuid }
        target_type: { $ref: '#/components/schemas/MediaTargetType' }
        target_id: { type: string, format: uuid }
        role: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
        alt_text: { type: string, minLength: 1, maxLength: 200 }
        sort_order: { type: integer, minimum: 0, maximum: 999 }
        crop_focus:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [x, y]
              properties:
                x: { type: number, minimum: 0, maximum: 1 }
                y: { type: number, minimum: 0, maximum: 1 }
        variant: { type: [string, 'null'], pattern: '^[a-z0-9][a-z0-9._-]{0,127}$' }
        source_media_reference_id: { type: [string, 'null'], format: uuid }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MediaReferencePage:
      type: object
      additionalProperties: false
      required: [items, total_count]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MediaReference' }
        total_count: { type: integer, minimum: 0 }
    MediaReferenceCreateRequest:
      type: object
      additionalProperties: false
      required:
        - media_resource_id
        - target_type
        - target_id
        - role
        - alt_text
        - sort_order
        - crop_focus
        - variant
        - client_request_id
      properties:
        media_resource_id: { type: string, format: uuid }
        target_type: { $ref: '#/components/schemas/MediaTargetType' }
        target_id: { type: string, format: uuid }
        role: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
        alt_text: { type: string, minLength: 1, maxLength: 200 }
        sort_order: { type: integer, minimum: 0, maximum: 999 }
        crop_focus:
          oneOf:
            - type: 'null'
            - type: object
        variant: { type: [string, 'null'], maxLength: 128 }
        client_request_id: { type: string, minLength: 8, maxLength: 128 }
    MediaReferencePatchRequest:
      type: object
      additionalProperties: false
      required: [expected_version, alt_text, sort_order, crop_focus, variant]
      properties:
        expected_version: { type: integer, minimum: 1 }
        alt_text: { type: string, minLength: 1, maxLength: 200 }
        sort_order: { type: integer, minimum: 0, maximum: 999 }
        crop_focus:
          oneOf:
            - type: 'null'
            - type: object
        variant: { type: [string, 'null'], maxLength: 128 }
    VersionedOperationRequest:
      type: object
      additionalProperties: false
      required: [expected_version, operation_id]
      properties:
        expected_version: { type: integer, minimum: 1 }
        operation_id: { type: string, minLength: 8, maxLength: 128 }
    EvidenceParentType:
      enum:
        - submission_draft
        - admin_project_creation_draft
        - admin_project_edit_draft
        - project_update
        - relation_candidate
    EvidenceFinalTargetKind:
      enum: [project, version, event, asset, relation]
    EvidenceType:
      enum: [platform_verified_fact, verified_author_statement, trusted_external_source, system_inference]
    EvidenceSourceChannel:
      enum: [official_site, repository, release_note, media_report, author_statement, platform_check]
    EvidenceVisibility:
      enum: [public, reviewer_only, private]
    EvidenceFinalFieldPreview:
      type: object
      additionalProperties: false
      required: [source_summary, captured_at, collected_by, confidence, source_channel]
      properties:
        source_summary: { type: string, minLength: 1, maxLength: 2000 }
        captured_at: { type: string, format: date-time }
        collected_by: { enum: [system, platform_editor, verified_author, user] }
        confidence: { enum: [high, medium, low] }
        source_channel: { $ref: '#/components/schemas/EvidenceSourceChannel' }
    EvidenceAttachmentDraft:
      type: object
      additionalProperties: false
      required:
        - attachment_draft_id
        - evidence_draft_id
        - media_resource_id
        - role
        - requested_visibility
        - status
        - version
        - evidence_draft_version
        - created_at
        - updated_at
      properties:
        attachment_draft_id: { type: string, format: uuid }
        evidence_draft_id: { type: string, format: uuid }
        media_resource_id: { type: string, format: uuid }
        role: { enum: [supporting_document, supporting_image] }
        requested_visibility: { $ref: '#/components/schemas/EvidenceVisibility' }
        status: { enum: [active, withdrawn, promoted, expired] }
        version: { type: integer, minimum: 1 }
        evidence_draft_version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EvidenceDraft:
      type: object
      additionalProperties: false
      required:
        - evidence_draft_id
        - collector_actor_type
        - parent_type
        - parent_id
        - final_target_kind
        - target_asset_draft_key
        - evidence_type
        - source_channel
        - field_path
        - requested_visibility
        - source_url
        - text_excerpt
        - attachment_drafts
        - status
        - bound
        - source_hash
        - final_field_preview
        - completed_at
        - promoted_evidence_id
        - version
        - created_at
        - updated_at
      properties:
        evidence_draft_id: { type: string, format: uuid }
        collector_actor_type: { enum: [system, platform_editor, verified_author, user] }
        parent_type: { $ref: '#/components/schemas/EvidenceParentType' }
        parent_id: { type: string, format: uuid }
        final_target_kind: { $ref: '#/components/schemas/EvidenceFinalTargetKind' }
        target_asset_draft_key: { type: [string, 'null'], maxLength: 128 }
        evidence_type: { $ref: '#/components/schemas/EvidenceType' }
        source_channel: { $ref: '#/components/schemas/EvidenceSourceChannel' }
        field_path: { type: [string, 'null'], maxLength: 240 }
        requested_visibility: { $ref: '#/components/schemas/EvidenceVisibility' }
        source_url: { type: [string, 'null'], format: uri, maxLength: 2048 }
        text_excerpt: { type: [string, 'null'], maxLength: 2000 }
        attachment_drafts:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/EvidenceAttachmentDraft' }
        status: { enum: [editing, ready, withdrawn, promoted, expired] }
        bound: { type: boolean }
        source_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
        final_field_preview:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/EvidenceFinalFieldPreview'
        completed_at: { type: [string, 'null'], format: date-time }
        promoted_evidence_id: { type: [string, 'null'], format: uuid }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EvidenceDraftCreateRequest:
      type: object
      additionalProperties: false
      required:
        - parent_type
        - parent_id
        - final_target_kind
        - requested_visibility
        - evidence_type
        - source_channel
        - client_request_id
      properties:
        parent_type: { $ref: '#/components/schemas/EvidenceParentType' }
        parent_id: { type: string, format: uuid }
        final_target_kind: { $ref: '#/components/schemas/EvidenceFinalTargetKind' }
        target_asset_draft_key: { type: [string, 'null'], maxLength: 128 }
        field_path: { type: [string, 'null'], maxLength: 240 }
        requested_visibility: { $ref: '#/components/schemas/EvidenceVisibility' }
        evidence_type: { $ref: '#/components/schemas/EvidenceType' }
        source_channel: { $ref: '#/components/schemas/EvidenceSourceChannel' }
        client_request_id: { type: string, minLength: 8, maxLength: 128 }
    EvidenceDraftPatchRequest:
      type: object
      additionalProperties: false
      required: [expected_version]
      minProperties: 2
      properties:
        expected_version: { type: integer, minimum: 1 }
        source_url: { type: [string, 'null'], format: uri, maxLength: 2048 }
        internal_record_ref: { type: [string, 'null'], maxLength: 240 }
        text_excerpt: { type: [string, 'null'], maxLength: 2000 }
        field_path: { type: [string, 'null'], maxLength: 240 }
        requested_visibility: { $ref: '#/components/schemas/EvidenceVisibility' }
    EvidenceDraftBindRequest:
      type: object
      additionalProperties: false
      required: [parent_type, parent_id, expected_parent_version, operation_id]
      properties:
        parent_type: { $ref: '#/components/schemas/EvidenceParentType' }
        parent_id: { type: string, format: uuid }
        expected_parent_version: { type: integer, minimum: 1 }
        operation_id: { type: string, minLength: 8, maxLength: 128 }
    EvidenceBinding:
      type: object
      additionalProperties: false
      required:
        - parent_type
        - parent_id
        - evidence_draft_ids
        - parent_version
        - evidence_draft_version
      properties:
        parent_type: { $ref: '#/components/schemas/EvidenceParentType' }
        parent_id: { type: string, format: uuid }
        evidence_draft_ids:
          type: array
          maxItems: 50
          items: { type: string, format: uuid }
        parent_version: { type: integer, minimum: 1 }
        evidence_draft_version: { type: integer, minimum: 1 }
    EvidenceDraftWithdrawRequest:
      type: object
      additionalProperties: false
      required: [expected_version, reason_code, operation_id]
      properties:
        expected_version: { type: integer, minimum: 1 }
        reason_code: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
        operation_id: { type: string, minLength: 8, maxLength: 128 }
    EvidenceAttachmentCreateRequest:
      type: object
      additionalProperties: false
      required:
        - media_resource_id
        - role
        - requested_visibility
        - client_request_id
        - expected_draft_version
      properties:
        media_resource_id: { type: string, format: uuid }
        role: { enum: [supporting_document, supporting_image] }
        requested_visibility: { $ref: '#/components/schemas/EvidenceVisibility' }
        client_request_id: { type: string, minLength: 8, maxLength: 128 }
        expected_draft_version: { type: integer, minimum: 1 }
    PendingActionCreateRequest:
      oneOf:
        - $ref: '#/components/schemas/PendingActionProjectStateRequest'
        - $ref: '#/components/schemas/PendingActionCommentRequest'
        - $ref: '#/components/schemas/PendingActionComparisonSaveRequest'
        - $ref: '#/components/schemas/PendingActionSubmissionStartRequest'
    PendingActionProjectStateRequest:
      type: object
      additionalProperties: false
      required: [action_type, parameters, return_to, client_request_id]
      properties:
        action_type:
          enum: [set_project_favorite, set_project_like, set_project_follow]
        parameters:
          type: object
          additionalProperties: false
          required: [project_id, state]
          properties:
            project_id: { type: string, format: uuid }
            state: { type: boolean }
        return_to: { type: string, minLength: 1, maxLength: 2048 }
        client_request_id: { type: string, format: uuid }
    PendingActionCommentRequest:
      type: object
      additionalProperties: false
      required: [action_type, parameters, return_to, client_request_id]
      properties:
        action_type: { const: create_comment }
        parameters:
          type: object
          additionalProperties: false
          required: [project_id, body]
          properties:
            project_id: { type: string, format: uuid }
            body: { type: string, minLength: 1, maxLength: 2000 }
            parent_comment_id: { type: [string, 'null'], format: uuid }
        return_to: { type: string, minLength: 1, maxLength: 2048 }
        client_request_id: { type: string, format: uuid }
    PendingActionComparisonSaveRequest:
      type: object
      additionalProperties: false
      required: [action_type, parameters, return_to, client_request_id]
      properties:
        action_type: { const: save_comparison }
        parameters:
          type: object
          additionalProperties: false
          required: [comparison_id, comparison_version, state]
          properties:
            comparison_id: { type: string, format: uuid }
            comparison_version: { type: integer, minimum: 1 }
            state: { const: true }
        return_to: { type: string, minLength: 1, maxLength: 2048 }
        client_request_id: { type: string, format: uuid }
    PendingActionSubmissionStartRequest:
      type: object
      additionalProperties: false
      required: [action_type, parameters, return_to, client_request_id]
      properties:
        action_type: { const: start_submission }
        parameters:
          type: object
          additionalProperties: false
          required: [category_id]
          properties:
            category_id:
              enum: [ai_learning_quiz, personal_site_portfolio]
        return_to: { type: string, minLength: 1, maxLength: 2048 }
        client_request_id: { type: string, format: uuid }
    PendingActionProjection:
      type: object
      additionalProperties: false
      required:
        - pending_action_id
        - action_type
        - return_to
        - status
        - expires_at
        - consumed_at
        - cancelled_at
        - cancel_reason
      properties:
        pending_action_id: { type: string, format: uuid }
        action_type:
          enum:
            - set_project_favorite
            - set_project_like
            - set_project_follow
            - create_comment
            - save_comparison
            - start_submission
        return_to: { type: string, minLength: 1, maxLength: 2048 }
        status: { enum: [pending, consumed, cancelled, expired] }
        expires_at: { type: string, format: date-time }
        consumed_at: { type: [string, 'null'], format: date-time }
        cancelled_at: { type: [string, 'null'], format: date-time }
        cancel_reason: { type: [string, 'null'], maxLength: 128 }
    PendingActionConsumeRequest:
      type: object
      additionalProperties: false
      required: [identity_link_id, expected_status]
      properties:
        identity_link_id: { type: string, format: uuid }
        expected_status: { const: pending }
    PendingActionCancelRequest:
      type: object
      additionalProperties: false
      required: [cancel_reason, client_request_id]
      properties:
        identity_link_id: { type: string, format: uuid }
        cancel_reason: { type: string, minLength: 1, maxLength: 128 }
        client_request_id: { type: string, format: uuid }
    ComparisonPutRequest:
      type: object
      additionalProperties: false
      required: [ordered_project_ids, comparison_version, client_request_id]
      properties:
        ordered_project_ids:
          type: array
          minItems: 0
          maxItems: 5
          uniqueItems: true
          items: { type: string, format: uuid }
        comparison_version:
          type: integer
          minimum: 0
          description: Use 0 only for the first write; subsequent writes use the current stored version.
        client_request_id:
          type: string
          format: uuid
    ComparisonSaveRequest:
      type: object
      additionalProperties: false
      required: [state, comparison_version]
      properties:
        state: { type: boolean }
        comparison_version: { type: integer, minimum: 1 }
    InteractionSetRequest:
      type: object
      additionalProperties: false
      required: [state, client_request_id]
      properties:
        state: { type: boolean }
        client_request_id:
          type: string
          minLength: 8
          maxLength: 128
          pattern: '^[A-Za-z0-9_-]+$'
    InteractionStates:
      type: object
      additionalProperties: false
      required: [favorite, like, follow]
      properties:
        favorite: { type: boolean }
        like: { type: boolean }
        follow: { type: boolean }
    InteractionCounts:
      type: object
      additionalProperties: false
      required: [favorite_count, like_count, follower_count]
      properties:
        favorite_count: { type: integer, minimum: 0 }
        like_count: { type: integer, minimum: 0 }
        follower_count: { type: integer, minimum: 0 }
    InteractionCountDeltas:
      type: object
      additionalProperties: false
      required: [favorite_count, like_count, follower_count]
      properties:
        favorite_count: { type: integer, minimum: -1, maximum: 1 }
        like_count: { type: integer, minimum: -1, maximum: 1 }
        follower_count: { type: integer, minimum: -1, maximum: 1 }
    InteractionChangeSources:
      type: object
      additionalProperties: false
      required: [favorite, like, follow]
      properties:
        favorite:
          type: [string, 'null']
          enum: [explicit, follow_cascade, null]
        like:
          type: [string, 'null']
          enum: [explicit, null]
        follow:
          type: [string, 'null']
          enum: [explicit, favorite_cascade, null]
    ProjectInteractionProjection:
      type: object
      additionalProperties: false
      required:
        - project_id
        - result
        - states
        - counts
        - count_deltas
        - change_sources
        - updated_at
      properties:
        project_id: { type: string, format: uuid }
        result: { type: string, enum: [changed, no_change] }
        states: { $ref: '#/components/schemas/InteractionStates' }
        counts: { $ref: '#/components/schemas/InteractionCounts' }
        count_deltas: { $ref: '#/components/schemas/InteractionCountDeltas' }
        change_sources: { $ref: '#/components/schemas/InteractionChangeSources' }
        updated_at: { type: string, format: date-time }
    NotificationType:
      type: string
      enum: [submission_published, project_updated]
    NotificationProjection:
      type: object
      additionalProperties: false
      required:
        - notification_id
        - type
        - title
        - body_summary
        - target_type
        - target_id
        - event_id
        - read_at
        - created_at
      properties:
        notification_id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/NotificationType' }
        title: { type: string, minLength: 1, maxLength: 120 }
        body_summary: { type: string, minLength: 1, maxLength: 500 }
        target_type: { type: string, const: project }
        target_id: { type: string, format: uuid }
        event_id:
          type: [string, 'null']
          format: uuid
        read_at:
          type: [string, 'null']
          format: date-time
        created_at: { type: string, format: date-time }
    NotificationPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, unread_count]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/NotificationProjection' }
        next_cursor:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 1024
            - type: 'null'
        unread_count: { type: integer, minimum: 0 }
    NotificationReadSetRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [notification_ids, read, operation_id]
          properties:
            notification_ids:
              type: array
              minItems: 1
              maxItems: 100
              uniqueItems: true
              items: { type: string, format: uuid }
            read: { type: boolean, const: true }
            operation_id:
              type: string
              minLength: 8
              maxLength: 128
              pattern: '^[A-Za-z0-9_-]+$'
        - type: object
          additionalProperties: false
          required: [scope, read, operation_id]
          properties:
            scope: { type: string, const: all }
            read: { type: boolean, const: true }
            operation_id:
              type: string
              minLength: 8
              maxLength: 128
              pattern: '^[A-Za-z0-9_-]+$'
    NotificationReadProjection:
      type: object
      additionalProperties: false
      required: [read, changed_count, unread_count, read_at]
      properties:
        read: { type: boolean, const: true }
        changed_count: { type: integer, minimum: 0 }
        unread_count: { type: integer, minimum: 0 }
        read_at: { type: string, format: date-time }
    CommentCreateRequest:
      type: object
      additionalProperties: false
      required: [body, client_request_id]
      properties:
        body: { type: string, minLength: 1, maxLength: 2000 }
        parent_comment_id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        client_request_id:
          type: string
          minLength: 8
          maxLength: 128
          pattern: '^[A-Za-z0-9_-]+$'
    CommentProjection:
      type: object
      additionalProperties: false
      required:
        - comment_id
        - project_id
        - parent_comment_id
        - body
        - moderation_state
        - version
        - result
        - created_at
        - updated_at
