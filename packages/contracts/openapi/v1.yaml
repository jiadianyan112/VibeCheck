        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AdminOperationTarget:
      type: object
      additionalProperties: false
      required: [target_type, target_id]
      properties:
        target_type:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
        target_id:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
    AdminOperationImpact:
      type: object
      additionalProperties: false
      required: [target_count, expected_version_count, changed_top_level_fields]
      properties:
        target_count: { type: integer, minimum: 1, maximum: 20 }
        expected_version_count: { type: integer, minimum: 1, maximum: 50 }
        changed_top_level_fields:
          type: array
          maxItems: 200
          items: { type: string }
    AdminOperationPreviewRequest:
      type: object
      additionalProperties: false
      required: [operation_type, targets, expected_versions, proposed_diff, reason_code]
      properties:
        operation_type:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
        targets:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: { $ref: '#/components/schemas/AdminOperationTarget' }
        expected_versions:
          type: object
          minProperties: 1
          maxProperties: 50
          additionalProperties: { type: integer, minimum: 1 }
        proposed_diff:
          type: object
          maxProperties: 200
        reason_code:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
        claim_token:
          type: [string, 'null']
          pattern: '^[A-Za-z0-9_-]{43}$'
        expected_conflict_principal_version:
          type: [integer, 'null']
          minimum: 1
    AdminOperationPreview:
      type: object
      additionalProperties: false
      required:
        - preview_token
        - operation_type
        - targets
        - expected_versions
        - diff
        - impact
        - confirmation_summary_hash
        - expires_at
        - conflict_principal_version
      properties:
        preview_token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
        operation_type:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
        targets:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/AdminOperationTarget' }
        expected_versions:
          type: object
          additionalProperties: { type: integer, minimum: 1 }
        diff: { type: object }
        impact: { $ref: '#/components/schemas/AdminOperationImpact' }
        confirmation_summary_hash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        expires_at: { type: string, format: date-time }
        conflict_principal_version:
          type: [integer, 'null']
          minimum: 1
    AdminOperationConfirmRequest:
      type: object
      additionalProperties: false
      required: [preview_token, confirmation_summary_hash, confirm_request_id]
      properties:
        preview_token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
        confirmation_summary_hash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        confirm_request_id:
          type: string
          pattern: '^[A-Za-z0-9_-]{8,64}$'
        reauth_grant_id:
          type: [string, 'null']
          format: uuid
        expected_conflict_principal_version:
          type: [integer, 'null']
          minimum: 1
    AdminOperationConfirm:
      type: object
      additionalProperties: false
      required:
        - confirm_token
        - expires_at
        - binding_summary
        - assurance_source
        - conflict_principal_version
        - replayed
      properties:
        confirm_token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
        expires_at: { type: string, format: date-time }
        binding_summary:
          type: object
          additionalProperties: false
          required: [operation_type, target_count, confirmation_summary_hash]
          properties:
            operation_type:
              type: string
              pattern: '^[a-z][a-z0-9_]{0,63}$'
            target_count: { type: integer, minimum: 1, maximum: 20 }
            confirmation_summary_hash:
              type: string
              pattern: '^[a-f0-9]{64}$'
        assurance_source:
          type: string
          enum: [recent_session, step_up_grant]
        conflict_principal_version:
          type: [integer, 'null']
          minimum: 1
        replayed: { type: boolean }
    ReviewWorkType:
      type: string
      enum:
        - submission
        - project_update
        - verification
        - ownership_case
        - evidence
        - recheck
        - relation
        - community
        - creator_profile
    ReviewTargetType:
      type: string
      enum:
        - submission
        - project_update
        - verification_request
        - ownership_case
        - evidence
        - recheck_task
        - relation_candidate
        - comment
        - report
        - creator_profile_draft
    ReviewWorkItemStatus:
      type: string
      enum: [queued, claimed, decided, cancelled]
    ReviewDomainSummary:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          minLength: 1
          maxLength: 64
    ReviewWorkItem:
      type: object
      additionalProperties: false
      required:
        - work_item_id
        - work_type
        - target_type
        - target_id
        - work_item_status
        - version
        - assignee_user_id
        - lease_expires_at
        - domain_summary
        - created_at
        - updated_at
      properties:
        work_item_id:
          type: string
          format: uuid
        work_type:
          $ref: '#/components/schemas/ReviewWorkType'
        target_type:
          $ref: '#/components/schemas/ReviewTargetType'
        target_id:
          type: string
          format: uuid
        work_item_status:
          $ref: '#/components/schemas/ReviewWorkItemStatus'
        version:
          type: integer
          minimum: 1
        assignee_user_id:
          type: [string, 'null']
          format: uuid
        lease_expires_at:
          type: [string, 'null']
          format: date-time
        domain_summary:
          $ref: '#/components/schemas/ReviewDomainSummary'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ReviewWorkItemPage:
      type: object
      additionalProperties: false
      required: [items, total_count, next_cursor]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ReviewWorkItem'
        total_count:
          type: integer
          minimum: 0
        next_cursor:
          type: [string, 'null']
          maxLength: 2048
    ReviewClaimRequest:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version:
          type: integer
          minimum: 1
        expected_conflict_principal_version:
          type: [integer, 'null']
          minimum: 1
    ReviewHeartbeatRequest:
      type: object
      additionalProperties: false
      required: [claim_token]
      properties:
        claim_token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
    ReviewReleaseRequest:
      type: object
      additionalProperties: false
      required: [claim_token, reason_code]
      properties:
        claim_token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
        reason_code:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
    ReviewDecisionRequest:
      type: object
      additionalProperties: false
      required:
        - preview_token
        - claim_token
        - confirm_token
        - decision
        - reason_code
        - field_paths
        - decision_evidence_refs
        - expected_version
        - decision_request_id
        - decision_payload
      properties:
        preview_token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
        claim_token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
        confirm_token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
        decision:
          type: string
          enum: [approve, changes_requested, reject]
        reason_code:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
        field_paths:
          type: array
          maxItems: 50
          uniqueItems: true
          description: Must contain at least one JSON Pointer when decision is changes_requested.
          items:
            type: string
            minLength: 1
            maxLength: 512
            pattern: '^/'
        decision_evidence_refs:
          type: array
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            format: uuid
        expected_version:
          type: integer
          minimum: 1
          description: Version of the claimed ReviewWorkItem; the Submission or ProjectUpdate version is frozen in the preview.
        decision_request_id:
          type: string
          pattern: '^[A-Za-z0-9_-]{8,64}$'
        decision_payload:
          type: object
          additionalProperties: false
          description: Submission and ProjectUpdate v1 have no client-authoritative branch fields and require an empty object.
    ReviewDecision:
      type: object
      additionalProperties: false
      required:
        - review_decision_id
        - work_item_id
        - work_type
        - target_type
        - target_id
        - decision
        - project_id
        - base_version_id
        - resulting_status
        - work_item_status
        - work_item_decision_ref_type
        - transaction_id
        - committed_at
        - schema_version
        - domain_status
        - outbox_status
      properties:
        review_decision_id: { type: string, format: uuid }
        work_item_id: { type: string, format: uuid }
        work_type: { type: string, enum: [submission, project_update] }
        target_type: { type: string, enum: [submission, project_update] }
        target_id: { type: string, format: uuid }
        decision:
          type: string
          enum: [approve, changes_requested, reject]
        project_id: { type: [string, 'null'], format: uuid }
        base_version_id: { type: [string, 'null'], format: uuid }
        resulting_status:
          type: string
          enum: [approved, changes_requested, rejected]
        work_item_status: { type: string, const: decided }
        work_item_decision_ref_type: { type: string, const: review_decision }
        transaction_id: { type: string, format: uuid }
        committed_at: { type: string, format: date-time }
        schema_version: { type: string, const: review_decision.v1 }
        domain_status:
          type: string
          enum: [approved, changes_requested, rejected]
        outbox_status: { type: string, const: pending }
    ReviewClaimProjection:
      type: object
      additionalProperties: false
      required:
        - work_item_id
        - work_type
        - target_type
        - target_id
        - work_item_status
        - version
        - assignee_user_id
        - lease_expires_at
        - domain_summary
        - created_at
        - updated_at
        - claim_token
      properties:
        work_item_id:
          type: string
          format: uuid
        work_type:
          $ref: '#/components/schemas/ReviewWorkType'
        target_type:
          $ref: '#/components/schemas/ReviewTargetType'
        target_id:
          type: string
          format: uuid
        work_item_status:
          $ref: '#/components/schemas/ReviewWorkItemStatus'
        version:
          type: integer
          minimum: 1
        assignee_user_id:
          type: [string, 'null']
          format: uuid
        lease_expires_at:
          type: [string, 'null']
          format: date-time
        domain_summary:
          $ref: '#/components/schemas/ReviewDomainSummary'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        claim_token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
