openapi: 3.1.0
info:
  title: VibeCheck API
  version: 0.1.0
  description: >-
    WP-03 platform, identity, public catalog, keyword-search and comparison contract. Product operations are added only when
    their module enters implementation and must preserve the v1.10 PRD Operation IDs.
servers:
  - url: /
    description: Platform paths are root-relative; product paths use the /api/v1 prefix.
tags:
  - name: Platform
  - name: Identity
  - name: Catalog
  - name: Search
  - name: Comparison
paths:
  /health/live:
    get:
      tags: [Platform]
      operationId: OP-PLATFORM-LIVE
      summary: Process liveness
      responses:
        '200':
          description: Process is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceHealth'
  /health/ready:
    get:
      tags: [Platform]
      operationId: OP-PLATFORM-READY
      summary: Dependency readiness
      responses:
        '200':
          description: Required dependencies are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceHealth'
        '503':
          description: At least one required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceHealth'
  /api/v1/auth/email-challenges:
    post:
      tags: [Identity]
      operationId: OP-AUTH-START
      summary: Start an email OTP login or administrator reauthentication flow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthChallengeRequest'
      responses:
        '202':
          description: Challenge accepted without revealing account existence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthChallengeAccepted'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/auth/email-challenges/{challenge_id}/verify:
    post:
      tags: [Identity]
      operationId: OP-AUTH-CALLBACK
      summary: Verify one email OTP and atomically establish or elevate a session
      parameters:
        - in: path
          name: challenge_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthVerifyRequest'
      responses:
        '200':
          description: OTP consumed exactly once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthVerificationResponse'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /api/v1/auth/session:
    get:
      tags: [Identity]
      operationId: OP-AUTH-SESSION-GET
      summary: Read the current server session and permission summary
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current active session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    delete:
      tags: [Identity]
      operationId: OP-AUTH-SESSION-DELETE
      summary: Revoke the current session
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [session_version]
              properties:
                session_version:
                  type: integer
                  minimum: 1
      responses:
        '204':
          description: Session revoked and cookies cleared.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/auth/pending-actions:
    post:
      tags: [Identity]
      operationId: OP-AUTH-PENDING-CREATE
      summary: Create one encrypted owner-bound action for post-login replay
      description: >-
        Anonymous callers are bound to the signed vc_anon cookie. Authenticated callers additionally
        require CSRF. A subject may have only one non-expired pending action; the same client request
        and payload is idempotent and a different payload is a 409 conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PendingActionCreateRequest'
      responses:
        '201':
          description: Encrypted action accepted; sensitive parameters are not returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingActionProjection'
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/auth/pending-actions/{pending_action_id}:
    get:
      tags: [Identity]
      operationId: OP-AUTH-PENDING-GET
      summary: Recover a non-sensitive pending-action projection
      parameters:
        - $ref: '#/components/parameters/PendingActionId'
        - in: query
          name: identity_link_id
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Owner-authorized projection without the encrypted action parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingActionProjection'
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/auth/pending-actions/{pending_action_id}/consume:
    post:
      tags: [Identity]
      operationId: OP-AUTH-PENDING-CONSUME
      summary: Mark an action consumed only after an attested domain write succeeds
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PendingActionId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PendingActionConsumeRequest'
      responses:
        '200':
          description: Consumed terminal state; the encrypted payload is cryptographically erased.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingActionProjection'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/auth/pending-actions/{pending_action_id}/cancel:
    post:
      tags: [Identity]
      operationId: OP-AUTH-PENDING-CANCEL
      summary: Irreversibly cancel an owner-authorized pending action
      parameters:
        - $ref: '#/components/parameters/PendingActionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PendingActionCancelRequest'
      responses:
        '200':
          description: Idempotent cancelled terminal state; all bound active replay links are revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingActionProjection'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/search:
    post:
      tags: [Search]
      operationId: OP-SEARCH
      summary: Execute or resume an owner-bound public keyword search
      description: >-
        Exactly one of query and query_id is accepted. The current implementation serves
        mode=search with PostgreSQL FTS and structured filters. mode=discover remains a
        frozen contract but returns SEARCH_DISCOVER_NOT_IMPLEMENTED until its work package ships.
        Raw query text is encrypted in QuerySnapshot and is never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Stable versioned search groups; no raw query is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchProjection'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '501':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/comparisons/{comparison_id}:
    parameters:
      - $ref: '#/components/parameters/ComparisonId'
    get:
      tags: [Comparison]
      operationId: OP-COMP-GET
      summary: Read the current owner-bound comparison version
      description: >-
        Anonymous ownership is bound to the signed vc_anon cookie and expires after seven days.
        Removed, merged or non-public projects remain as invalid tombstones instead of being silently removed.
      responses:
        '200':
          description: Current comparison version and its version-scoped progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonProjection'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    put:
      tags: [Comparison]
      operationId: OP-COMP-PUT
      summary: Atomically create or replace ordered comparison membership
      description: >-
        The first write uses comparison_version=0 and one to five projects and creates stored version 1.
        Later writes require the current version. A changed order or membership increments the version and
        resets progress for the new version; an identical list returns no_change without incrementing it.
        All projects must be public and belong to one category. Six or more is a 409 conflict and is never truncated.
        Authenticated browser writes additionally require a matching X-CSRF-Token header.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComparisonPutRequest'
      responses:
        '200':
          description: Created, changed or idempotently unchanged comparison.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonMutationProjection'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/comparisons/{comparison_id}/saved:
    put:
      tags: [Comparison]
      operationId: OP-COMP-SAVE
      summary: Set the final saved state for an authenticated comparison owner
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ComparisonId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComparisonSaveRequest'
      responses:
        '200':
          description: Comparison with the requested final saved state; repeated state is idempotent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonProjection'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/auth/comparison-merge-conflicts/{conflict_id}:
    get:
      tags: [Auth, Comparison]
      operationId: OP-AUTH-MERGE-GET
      summary: Recover one authenticated user's comparison merge conflict
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ConflictId'
      responses:
        '200':
          description: Frozen source versions, ordered candidates and visible project summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonMergeConflictProjection'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/auth/comparison-merge-conflicts/{conflict_id}/resolve:
    post:
      tags: [Auth, Comparison]
      operationId: OP-AUTH-MERGE-RESOLVE
      summary: Resolve an over-limit anonymous/account comparison union
      description: >-
        Revalidates both frozen comparison versions, candidate membership, current visibility,
        same-category membership and the conflict version. The original comparisons are retained;
        the selected zero-to-five projects become a new account comparison version.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ConflictId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComparisonMergeResolveRequest'
      responses:
        '200':
          description: Idempotent terminal resolution and new account comparison version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonMergeResolutionProjection'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/auth/comparison-merge-conflicts/{conflict_id}/cancel:
    post:
      tags: [Auth, Comparison]
      operationId: OP-AUTH-MERGE-CANCEL
      summary: Cancel a pending merge without changing either source comparison
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ConflictId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComparisonMergeCancelRequest'
      responses:
        '200':
          description: Idempotent cancelled terminal state; related pending action is cancelled when present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonMergeCancellationProjection'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/query-snapshots/{query_id}:
    get:
      tags: [Search]
      operationId: OP-QUERY-GET
      summary: Recover a non-sensitive owner-authorized QuerySnapshot projection
      parameters:
        - $ref: '#/components/parameters/QueryId'
      responses:
        '200':
          description: Structured intent, filters, sort and version state; raw input is never returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuerySnapshotProjection'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
    delete:
      tags: [Search]
      operationId: OP-QUERY-INVALIDATE
      summary: Idempotently invalidate and cryptographically erase a QuerySnapshot
      parameters:
        - $ref: '#/components/parameters/QueryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryInvalidationRequest'
      responses:
        '204':
          description: Invalidated, or already invalidated by this authorized subject.
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/query-snapshots/{query_id}/authorized-subjects:
    post:
      tags: [Search]
      operationId: OP-QUERY-LINK
      summary: Consume one query_continuation IdentityLink to authorize the logged-in user
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/QueryId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryLinkRequest'
      responses:
        '200':
          description: User authorization added without changing owner or expiry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryLinkProjection'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /api/v1/query-snapshots/{query_id}/authorized-subjects/me:
    delete:
      tags: [Search]
      operationId: OP-QUERY-UNLINK
      summary: Idempotently revoke the current linked user's QuerySnapshot authorization
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/QueryId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryMutationRequest'
      responses:
        '204':
          description: Authorization revoked or already revoked.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
  /api/v1/projects:
    get:
      tags: [Catalog]
      operationId: OP-PROJ-LIST
      summary: List a stable page of public projects across one or both P0 categories
      parameters:
        - in: query
          name: category_id
          required: false
          schema:
            $ref: '#/components/schemas/CategoryId'
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 24
        - in: query
          name: cursor
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 1024
      responses:
        '200':
          description: Public project cards bounded by a stable signed pagination watermark.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListProjection'
        '400':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/v1/projects/{project_id}:
    get:
      tags: [Catalog]
      operationId: OP-PROJ-GET
      summary: Read one canonical public project at its current immutable version
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Public project projection; private author-relation states are excluded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectProjection'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/v1/projects/{project_id}/events:
    get:
      tags: [Catalog]
      operationId: OP-EVENT-LIST
      summary: List the public current event heads for one canonical project
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: event_types
          required: false
          style: form
          explode: false
          schema:
            type: array
            maxItems: 12
            uniqueItems: true
            items:
              $ref: '#/components/schemas/EventType'
        - in: query
          name: include_superseded
          required: false
          schema:
            type: boolean
            default: false
        - in: query
          name: cursor
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 1024
      responses:
        '200':
          description: Stable public event page ordered by derived UTC anchor and event ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/v1/projects/{project_id}/assets:
    get:
      tags: [Catalog]
      operationId: OP-ASSET-LIST
      summary: List public reusable asset metadata without exposing a raw target
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: cursor
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 1024
      responses:
        '200':
          description: Stable public asset page; each target must use the later resolve operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetPage'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/v1/assets/{asset_id}/resolve:
    post:
      tags: [Catalog]
      operationId: OP-ASSET-RESOLVE
      summary: Resolve one stored asset target through the SSRF-safe network boundary
      parameters:
        - in: path
          name: asset_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetResolutionRequest'
      responses:
        '200':
          description: A short-lived immutable resolution receipt; uncertain requires user confirmation and blocked cannot continue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetResolutionProjection'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/creators/{creator_id}:
    get:
      tags: [Catalog]
      operationId: OP-CREATOR-GET
      summary: Read the canonical public creator profile and published project ids
      parameters:
        - in: path
          name: creator_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Public canonical creator projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorProjection'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: vc_session
  parameters:
    QueryId:
      in: path
      name: query_id
      required: true
      schema:
        type: string
        format: uuid
    ComparisonId:
      in: path
      name: comparison_id
      required: true
      schema:
        type: string
        format: uuid
    ConflictId:
      in: path
      name: conflict_id
      required: true
      schema:
        type: string
        format: uuid
    PendingActionId:
      in: path
      name: pending_action_id
      required: true
      schema:
        type: string
        format: uuid
    CsrfToken:
      in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 128
  responses:
    Error:
      description: Stable error envelope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    PendingActionCreateRequest:
      oneOf:
        - $ref: '#/components/schemas/PendingActionProjectStateRequest'
        - $ref: '#/components/schemas/PendingActionCommentRequest'
        - $ref: '#/components/schemas/PendingActionComparisonSaveRequest'
        - $ref: '#/components/schemas/PendingActionSubmissionStartRequest'
    PendingActionProjectStateRequest:
      type: object
      additionalProperties: false
      required: [action_type, parameters, return_to, client_request_id]
      properties:
        action_type:
          enum: [set_project_favorite, set_project_like, set_project_follow]
        parameters:
          type: object
          additionalProperties: false
          required: [project_id, state]
          properties:
            project_id: { type: string, format: uuid }
            state: { type: boolean }
        return_to: { type: string, minLength: 1, maxLength: 2048 }
        client_request_id: { type: string, format: uuid }
    PendingActionCommentRequest:
      type: object
      additionalProperties: false
      required: [action_type, parameters, return_to, client_request_id]
      properties:
        action_type: { const: create_comment }
        parameters:
          type: object
          additionalProperties: false
          required: [project_id, body]
          properties:
            project_id: { type: string, format: uuid }
            body: { type: string, minLength: 1, maxLength: 2000 }
            parent_comment_id: { type: [string, 'null'], format: uuid }
        return_to: { type: string, minLength: 1, maxLength: 2048 }
        client_request_id: { type: string, format: uuid }
    PendingActionComparisonSaveRequest:
      type: object
      additionalProperties: false
      required: [action_type, parameters, return_to, client_request_id]
      properties:
        action_type: { const: save_comparison }
        parameters:
          type: object
          additionalProperties: false
          required: [comparison_id, comparison_version, state]
          properties:
            comparison_id: { type: string, format: uuid }
            comparison_version: { type: integer, minimum: 1 }
            state: { const: true }
        return_to: { type: string, minLength: 1, maxLength: 2048 }
        client_request_id: { type: string, format: uuid }
    PendingActionSubmissionStartRequest:
      type: object
      additionalProperties: false
      required: [action_type, parameters, return_to, client_request_id]
      properties:
        action_type: { const: start_submission }
        parameters:
          type: object
          additionalProperties: false
          required: [category_id]
          properties:
            category_id:
              enum: [ai_learning_quiz, personal_site_portfolio]
        return_to: { type: string, minLength: 1, maxLength: 2048 }
        client_request_id: { type: string, format: uuid }
    PendingActionProjection:
      type: object
      additionalProperties: false
      required:
        - pending_action_id
        - action_type
        - return_to
        - status
        - expires_at
        - consumed_at
        - cancelled_at
        - cancel_reason
      properties:
        pending_action_id: { type: string, format: uuid }
        action_type:
          enum:
            - set_project_favorite
            - set_project_like
            - set_project_follow
            - create_comment
            - save_comparison
            - start_submission
        return_to: { type: string, minLength: 1, maxLength: 2048 }
        status: { enum: [pending, consumed, cancelled, expired] }
        expires_at: { type: string, format: date-time }
        consumed_at: { type: [string, 'null'], format: date-time }
        cancelled_at: { type: [string, 'null'], format: date-time }
        cancel_reason: { type: [string, 'null'], maxLength: 128 }
    PendingActionConsumeRequest:
      type: object
      additionalProperties: false
      required: [identity_link_id, execution_receipt, client_request_id, expected_status]
      properties:
        identity_link_id: { type: string, format: uuid }
        execution_receipt: { type: string, minLength: 32, maxLength: 2048 }
        client_request_id: { type: string, format: uuid }
        expected_status: { const: pending }
    PendingActionCancelRequest:
      type: object
      additionalProperties: false
      required: [cancel_reason, client_request_id]
      properties:
        identity_link_id: { type: string, format: uuid }
        cancel_reason: { type: string, minLength: 1, maxLength: 128 }
        client_request_id: { type: string, format: uuid }
    ComparisonPutRequest:
      type: object
      additionalProperties: false
      required: [ordered_project_ids, comparison_version, client_request_id]
      properties:
        ordered_project_ids:
          type: array
          minItems: 0
          maxItems: 5
          uniqueItems: true
          items: { type: string, format: uuid }
        comparison_version:
          type: integer
          minimum: 0
          description: Use 0 only for the first write; subsequent writes use the current stored version.
        client_request_id:
          type: string
          format: uuid
    ComparisonSaveRequest:
      type: object
      additionalProperties: false
      required: [state, comparison_version]
      properties:
        state: { type: boolean }
        comparison_version: { type: integer, minimum: 1 }
    ComparisonProjectSummary:
      type: object
      additionalProperties: false
      required:
        - project_id
        - current_name
        - category_id
        - access_status
        - freshness_status
        - last_verified_at
        - current_version_id
        - comparison_values
      properties:
        project_id: { type: string, format: uuid }
        current_name: { type: string, minLength: 1, maxLength: 120 }
        category_id: { $ref: '#/components/schemas/CategoryId' }
        access_status: { type: string, minLength: 1, maxLength: 64 }
        freshness_status: { type: string, minLength: 1, maxLength: 64 }
        last_verified_at: { type: string, format: date-time }
        current_version_id: { type: string, format: uuid }
        comparison_values:
          type: object
          additionalProperties:
            type: object
            additionalProperties: true
    ComparisonItem:
      type: object
      additionalProperties: false
      required:
        - project_id
        - position
        - validity_status
        - invalid_reason
        - canonical_project_id
        - project
      properties:
        project_id: { type: string, format: uuid }
        position: { type: integer, minimum: 1, maximum: 5 }
        validity_status: { type: string, enum: [valid, invalid] }
        invalid_reason:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 64
            - type: 'null'
        canonical_project_id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        project:
          oneOf:
            - $ref: '#/components/schemas/ComparisonProjectSummary'
            - type: 'null'
    ComparisonProjectionBase:
      type: object
      required:
        - comparison_id
        - comparison_version
        - category_id
        - category_schema_version
        - ordered_project_ids
        - items
        - valid_count
        - invalid_count
        - dimension_groups
        - dimension_groups_viewed
        - visible_duration_ms
        - saved_at
        - completed_at
        - expires_at
        - created_at
        - updated_at
      properties:
        comparison_id: { type: string, format: uuid }
        comparison_version: { type: integer, minimum: 1 }
        category_id: { $ref: '#/components/schemas/CategoryId' }
        category_schema_version: { type: string, enum: [learning.v1, portfolio.v1] }
        ordered_project_ids:
          type: array
          minItems: 0
          maxItems: 5
          uniqueItems: true
          items: { type: string, format: uuid }
        items:
          type: array
          minItems: 0
          maxItems: 5
          items: { $ref: '#/components/schemas/ComparisonItem' }
        valid_count: { type: integer, minimum: 0, maximum: 5 }
        invalid_count: { type: integer, minimum: 0, maximum: 5 }
        dimension_groups:
          type: array
          minItems: 4
          uniqueItems: true
          items: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
        dimension_groups_viewed:
          type: array
          maxItems: 64
          uniqueItems: true
          items: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
        visible_duration_ms: { type: integer, minimum: 0 }
        saved_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        completed_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        expires_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ComparisonProjection:
      allOf:
        - $ref: '#/components/schemas/ComparisonProjectionBase'
      unevaluatedProperties: false
    ComparisonMutationProjection:
      allOf:
        - $ref: '#/components/schemas/ComparisonProjectionBase'
        - type: object
          required: [mutation_result]
          properties:
            mutation_result: { type: string, enum: [created, changed, no_change] }
      unevaluatedProperties: false
    ComparisonLoginMergeProjection:
      type: object
      additionalProperties: false
      required:
        - result
        - comparison_id
        - comparison_version
        - conflict_id
        - conflict_version
        - expires_at
      properties:
        result:
          type: string
          enum: [not_required, adopted, merged, conflict]
        comparison_id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        comparison_version:
          oneOf:
            - type: integer
              minimum: 1
            - type: 'null'
        conflict_id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        conflict_version:
          oneOf:
            - type: integer
              minimum: 1
            - type: 'null'
        expires_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
    ComparisonMergeProjectSummary:
      type: object
      additionalProperties: false
      required: [project_id, current_name, category_id, access_status, freshness_status, last_verified_at]
      properties:
        project_id: { type: string, format: uuid }
        current_name: { type: string, minLength: 1, maxLength: 120 }
        category_id: { $ref: '#/components/schemas/CategoryId' }
        access_status: { type: string, minLength: 1, maxLength: 64 }
        freshness_status: { type: string, minLength: 1, maxLength: 64 }
        last_verified_at: { type: string, format: date-time }
    ComparisonMergeConflictProjection:
      type: object
      additionalProperties: false
      required:
        - conflict_id
        - identity_link_id
        - account_comparison_id
        - account_comparison_version
        - anonymous_comparison_id
        - anonymous_comparison_version
        - candidate_project_ids
        - candidate_projects
        - selected_project_ids
        - status
        - pending_action_id
        - version
        - expires_at
        - resolved_at
        - cancelled_at
      properties:
        conflict_id: { type: string, format: uuid }
        identity_link_id: { type: string, format: uuid }
        account_comparison_id: { type: string, format: uuid }
        account_comparison_version: { type: integer, minimum: 1 }
        anonymous_comparison_id: { type: string, format: uuid }
        anonymous_comparison_version: { type: integer, minimum: 1 }
        candidate_project_ids:
          type: array
          minItems: 6
          maxItems: 10
          uniqueItems: true
          items: { type: string, format: uuid }
        candidate_projects:
          type: array
          maxItems: 10
          uniqueItems: true
          items: { $ref: '#/components/schemas/ComparisonMergeProjectSummary' }
        selected_project_ids:
          oneOf:
            - type: array
              minItems: 0
              maxItems: 5
              uniqueItems: true
              items: { type: string, format: uuid }
            - type: 'null'
        status: { type: string, enum: [pending, resolved, cancelled] }
        pending_action_id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        version: { type: integer, minimum: 1 }
        expires_at: { type: string, format: date-time }
        resolved_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        cancelled_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
    ComparisonMergeResolveRequest:
      type: object
      additionalProperties: false
      required:
        - selected_project_ids
        - account_version
        - anonymous_version
        - expected_conflict_version
        - operation_id
      properties:
        selected_project_ids:
          type: array
          minItems: 0
          maxItems: 5
          uniqueItems: true
          items: { type: string, format: uuid }
        account_version: { type: integer, minimum: 1 }
        anonymous_version: { type: integer, minimum: 1 }
        expected_conflict_version: { type: integer, minimum: 1 }
        operation_id: { type: string, format: uuid }
    ComparisonMergeCancelRequest:
      type: object
      additionalProperties: false
      required: [cancel_reason, expected_conflict_version, operation_id]
      properties:
        cancel_reason: { type: string, minLength: 1, maxLength: 128 }
        expected_conflict_version: { type: integer, minimum: 1 }
        operation_id: { type: string, format: uuid }
    ComparisonMergeResolutionProjection:
      type: object
      additionalProperties: false
      required:
        - conflict_id
        - status
        - conflict_version
        - comparison_id
        - comparison_version
        - selected_project_ids
        - resolved_at
      properties:
        conflict_id: { type: string, format: uuid }
        status: { const: resolved }
        conflict_version: { type: integer, minimum: 2 }
        comparison_id: { type: string, format: uuid }
        comparison_version: { type: integer, minimum: 2 }
        selected_project_ids:
          type: array
          minItems: 0
          maxItems: 5
          uniqueItems: true
          items: { type: string, format: uuid }
        resolved_at: { type: string, format: date-time }
    ComparisonMergeCancellationProjection:
      type: object
      additionalProperties: false
      required: [conflict_id, status, conflict_version, cancelled_at, pending_action_status]
      properties:
        conflict_id: { type: string, format: uuid }
        status: { const: cancelled }
        conflict_version: { type: integer, minimum: 2 }
        cancelled_at: { type: string, format: date-time }
        pending_action_status:
          oneOf:
            - const: cancelled
            - type: 'null'
    QuerySnapshotProjection:
      type: object
      additionalProperties: false
      required:
        - query_id
        - mode
        - category_id
        - intent
        - confidence
        - intent_version
        - parser_version
        - result_version
        - ranking_version
        - filters
        - sort
        - semantic_degraded
        - exact_count
        - adjacent_count
        - version
        - expires_at
        - input_state
        - notice_key
      properties:
        query_id: { type: string, format: uuid }
        mode: { type: string, enum: [search, discover] }
        category_id:
          oneOf:
            - $ref: '#/components/schemas/CategoryId'
            - type: 'null'
        intent:
          type: object
        confidence:
          type: object
        intent_version: { type: integer, minimum: 1 }
        parser_version: { type: string, minLength: 1, maxLength: 64 }
        result_version: { type: string, format: uuid }
        ranking_version: { type: string, minLength: 1, maxLength: 64 }
        filters: { $ref: '#/components/schemas/SearchFilters' }
        sort: { type: string, enum: [relevance] }
        semantic_degraded: { type: boolean }
        exact_count: { type: integer, minimum: 0 }
        adjacent_count: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 1 }
        expires_at: { type: string, format: date-time }
        input_state: { const: not_restored }
        notice_key: { const: search.conditions_restored }
    QueryLinkRequest:
      type: object
      additionalProperties: false
      required: [identity_link_id, expected_version, operation_id]
      properties:
        identity_link_id: { type: string, format: uuid }
        expected_version: { type: integer, minimum: 1 }
        operation_id: { type: string, format: uuid }
    QueryMutationRequest:
      type: object
      additionalProperties: false
      required: [expected_version, operation_id]
      properties:
        expected_version: { type: integer, minimum: 1 }
        operation_id: { type: string, format: uuid }
    QueryInvalidationRequest:
      type: object
      additionalProperties: false
      required: [operation_id]
      properties:
        operation_id: { type: string, format: uuid }
    QueryLinkProjection:
      type: object
      additionalProperties: false
      required: [authorized, version, expires_at]
      properties:
        authorized: { const: true }
        version: { type: integer, minimum: 2 }
        expires_at: { type: string, format: date-time }
    SearchRequest:
      type: object
      additionalProperties: false
      required: [mode]
      oneOf:
        - required: [query]
          not:
            required: [query_id]
        - required: [query_id]
          not:
            required: [query]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 500
          description: Sent only in the HTTPS body; forbidden in URLs, logs, analytics and response bodies.
        query_id:
          type: string
          format: uuid
        mode:
          type: string
          enum: [search, discover]
        category_id:
          $ref: '#/components/schemas/CategoryId'
        filters:
          $ref: '#/components/schemas/SearchFilters'
        sort:
          type: string
          enum: [relevance]
          default: relevance
        cursor:
          type: string
          minLength: 1
          maxLength: 2048
        locale:
          type: string
          minLength: 2
          maxLength: 35
          default: zh-CN
    SearchFilters:
      type: object
      additionalProperties: false
      properties:
        access_status:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [normal, login_required, partial_abnormal, link_unavailable, suspected_migration, paused, ended, unknown]
        has_available_asset:
          type: boolean
        verified_since:
          type: string
          format: date-time
        category_fields:
          $ref: '#/components/schemas/SearchCategoryFieldMap'
        exclude_category_fields:
          $ref: '#/components/schemas/SearchCategoryFieldMap'
    SearchCategoryFieldMap:
      type: object
      description: >-
        Keys are category-specific frozen filter fields. Values are OR within one field;
        different keys are AND. Unknown or cross-category keys return 422.
      maxProperties: 5
      additionalProperties:
        type: array
        minItems: 1
        maxItems: 10
        uniqueItems: true
        items:
          type: string
          minLength: 1
          maxLength: 64
    SearchMatchReason:
      type: object
      additionalProperties: false
      required: [matched_fields, unmatched_soft_fields, relaxed_fields, evidence_freshness, reason_template_key]
      properties:
        matched_fields:
          type: array
          uniqueItems: true
          items:
            type: string
        unmatched_soft_fields:
          type: array
          uniqueItems: true
          items:
            type: string
        relaxed_fields:
          type: array
          uniqueItems: true
          items:
            type: string
        evidence_freshness:
          type: string
          enum: [valid, expiring, expired]
        reason_template_key:
          type: string
          enum: [search.match.exact, search.match.adjacent]
    SearchResultItem:
      type: object
      additionalProperties: false
      required: [project_id, category_id, result_item_id, position, result_item_token, match_reason]
      properties:
        project_id:
          type: string
          format: uuid
        category_id:
          $ref: '#/components/schemas/CategoryId'
        result_item_id:
          type: string
          format: uuid
        position:
          type: integer
          minimum: 1
        result_item_token:
          type: string
          minLength: 32
          maxLength: 4096
        match_reason:
          $ref: '#/components/schemas/SearchMatchReason'
    SearchResultGroup:
      type: object
      additionalProperties: false
      required: [group_id, channel, default_collapsed, items]
      properties:
        group_id:
          type: string
          enum: [exact, adjacent]
        channel:
          type: string
          enum: [search_exact, search_adjacent]
        default_collapsed:
          type: boolean
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchResultItem'
    SearchProjection:
      type: object
      additionalProperties: false
      required:
        - query_id
        - intent_version
        - parser_version
        - result_version
        - ranking_version
        - mode
        - category_id
        - filters
        - sort
        - semantic_degraded
        - exact_count
        - adjacent_count
        - groups
        - next_cursor
        - expires_at
      properties:
        query_id:
          type: string
          format: uuid
        intent_version:
          type: integer
          minimum: 1
        parser_version:
          type: string
          enum: [keyword.v1]
        result_version:
          type: string
          format: uuid
        ranking_version:
          type: string
          enum: [search.keyword.v1]
        mode:
          type: string
          enum: [search]
        category_id:
          oneOf:
            - $ref: '#/components/schemas/CategoryId'
            - type: 'null'
        filters:
          $ref: '#/components/schemas/SearchFilters'
        sort:
          type: string
          enum: [relevance]
        semantic_degraded:
          type: boolean
          const: true
        exact_count:
          type: integer
          minimum: 0
        adjacent_count:
          type: integer
          minimum: 0
        groups:
          type: array
          maxItems: 2
          items:
            $ref: '#/components/schemas/SearchResultGroup'
        next_cursor:
          type: [string, 'null']
          maxLength: 2048
        expires_at:
          type: string
          format: date-time
    CategoryId:
      type: string
      enum: [ai_learning_quiz, personal_site_portfolio]
    CategorySchemaVersion:
      type: string
      enum: [learning.v1, portfolio.v1]
    KnowledgeStateStringArray:
      type: object
      additionalProperties: false
      required: [knowledge_state, values, source_type, observed_at]
      properties:
        knowledge_state:
          type: string
          enum: [known_values, known_empty, unknown]
        values:
          type: array
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 50
        source_type:
          type: string
          enum: [platform_verified_fact, verified_author_statement, trusted_external_source, system_inference]
        observed_at:
          type: string
          format: date-time
    ProjectCoreSnapshot:
      type: object
