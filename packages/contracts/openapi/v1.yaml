              format: uuid
            recent_auth_at:
              type: string
              format: date-time
            return_to:
              type: string
              minLength: 1
              maxLength: 2048
    AuthSession:
      type: object
      additionalProperties: false
      required:
        - authenticated
        - user_id
        - display_name
        - account_status
        - roles
        - primary_role
        - permissions
        - session_version
        - csrf_token
        - recent_auth_at
        - expires_at
      properties:
        authenticated:
          const: true
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
          minLength: 1
          maxLength: 320
        account_status:
          type: string
          enum: [active, restricted]
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [user, verified_author, editor, admin]
        primary_role:
          type: string
          enum: [user, verified_author, editor, admin]
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 64
        session_version:
          type: integer
          minimum: 1
        csrf_token:
          type: string
          minLength: 32
          maxLength: 128
        recent_auth_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    IdentityLinkProjection:
      type: object
      additionalProperties: false
      required: [identity_link_id, purpose, expires_at]
      properties:
        identity_link_id:
          type: string
          format: uuid
        purpose:
          type: string
          enum: [pending_action_replay, query_continuation, comparison_merge]
        expires_at:
          type: string
          format: date-time
