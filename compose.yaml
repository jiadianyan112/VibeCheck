name: vibecheck

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    environment:
      POSTGRES_DB: vibecheck
      POSTGRES_USER: vibecheck
      POSTGRES_PASSWORD: vibecheck_local_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibecheck -d vibecheck"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - vibecheck-postgres-data:/var/lib/postgresql/data

volumes:
  vibecheck-postgres-data:
