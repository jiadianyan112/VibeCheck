<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="VibeCheck 低保真可点击 Web 原型"
    />
    <title>VibeCheck 低保真原型</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (window.location.protocol === 'file:') {
        document.getElementById('root').innerHTML = `
          <main style="max-width:720px;margin:12vh auto;padding:32px;border:2px solid #171717;font:16px/1.65 system-ui;color:#171717;background:#fff">
            <p style="margin:0 0 8px;font-weight:800;letter-spacing:.08em">VIBECHECK PROTOTYPE</p>
            <h1 style="font-size:32px;margin:0 0 16px">请使用项目启动器打开</h1>
            <p>这是 React/Vite 源码入口，浏览器不能通过 <code>file://</code> 直接运行 TypeScript 模块。</p>
            <p>请返回项目文件夹，双击 <strong>打开VibeCheck原型.cmd</strong>。启动器会开启本地服务并自动打开原型。</p>
            <p style="margin-bottom:0;color:#555">开发命令：<code>npm run dev</code></p>
          </main>`
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
